## Portainer Stack - WhatsApp MCP Server
## Deploy this file as a stack in Portainer.
## Image: ghcr.io/abrauser/whatsapp-mcp-docker:latest

services:
  whatsapp-mcp:
    image: ghcr.io/abrauser/whatsapp-mcp-docker:latest
    container_name: whatsapp-mcp
    restart: unless-stopped
    ports:
      - "3010:3010"
    environment:
      - MCP_PORT=3010
      - TZ=Europe/Berlin
      - LOG_LEVEL=info
      - WHATSAPP_DEBUG=true
      - WHATSAPP_MCP_DATA_DIR=/app/data
      - WHATSAPP_AUTH_DIR=/app/auth_info
      # Set this in Portainer's stack environment UI. Leave empty ONLY if the
      # container is reachable only from trusted hosts (e.g. localhost).
      - MCP_AUTH_TOKEN=${MCP_AUTH_TOKEN:-}
    volumes:
      - /opt/docker/whatsapp-mcp/data:/app/data
      - /opt/docker/whatsapp-mcp/auth_info:/app/auth_info
    healthcheck:
      test: ["CMD", "wget", "-qO", "/dev/null", "http://localhost:3010/health"]
      interval: 30s
      timeout: 5s
      start_period: 60s
      retries: 3
